services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zapbot
      POSTGRES_USER: zapbot
      POSTGRES_PASSWORD: zapbot_local_password
    ports:
      - "5432:5432"
    volumes:
      - zapbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapbot -d zapbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.mvp
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zapbot:zapbot_local_password@postgres:5432/zapbot
      DB_SSL: "false"
      DB_SYNC_ALTER: "true"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  zapbot-postgres:
